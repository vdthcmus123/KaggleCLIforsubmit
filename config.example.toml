# Copy this file to config.toml and edit it.

[defaults]
top_n = 100
sort_by = "scoreDescending"
language = "python"
kernel_type = "all"
output_type = "data"
file_pattern = "(?i).*submission.*\\.csv$"
# Set this when a competition requires that exact native notebook output name.
# Alternate files are not renamed to satisfy this setting.
# submission_file_name = "submission.csv"
code_competition = false
auto_copy_notebook = false
copy_slug_prefix = "auto"
notebook_wait_timeout_seconds = 21600
notebook_poll_seconds = 60
submission_wait_timeout_seconds = 1800
submission_poll_seconds = 15
require_public_score = false
source_kernel_versions = {}
dataset_source_versions = {}
max_submissions_per_run = 1
max_submit_attempts_per_run = 1
max_submissions_per_day = 2
message_template = "AUTO public kernel {kernel_ref} file {file_name}"

[[competitions]]
# Example only. Replace with a competition slug you have joined.
slug = "titanic"
enabled = false
auto_submit = false
top_n = 100
sort_by = "scoreDescending"
file_pattern = "(?i).*submission.*\\.csv$"
code_competition = false
max_submissions_per_run = 1
max_submit_attempts_per_run = 1
max_submissions_per_day = 2

[[competitions]]
# Add more competitions as needed.
slug = "your-competition-slug"
