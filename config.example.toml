# Copy this file to config.toml. Join the competition on Kaggle first.
[defaults]
top_n = 100
sort_by = "hotness"
language = "python"
kernel_type = "notebook"
output_type = "data"
file_pattern = "auto"
auto_copy_notebook = true
copy_slug_prefix = "auto"
notebook_wait_timeout_seconds = 2700
notebook_poll_seconds = 60
submission_wait_timeout_seconds = 1800
submission_poll_seconds = 15
require_public_score = true
source_kernel_versions = {}
dataset_source_versions = {}
max_submissions_per_run = 1
max_submit_attempts_per_run = 3
max_submissions_per_day = 5
message_template = "AUTO public kernel {kernel_ref} file {file_name}"

[[competitions]]
slug = "rsna-knee-abnormality-detection"
enabled = false
auto_submit = false
# true: submit the output of an owned notebook version.
# false: upload the generated output file directly.
code_competition = true
# Optional only when several output artifacts are ambiguous.
# submission_file_name = "results/predictions.zip"

[[competitions]]
slug = "your-competition-slug"
enabled = false
auto_submit = false
code_competition = false
